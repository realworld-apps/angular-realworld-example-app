name: Spec freshness

# Red when the vendored RealWorld API spec is behind the default branch of
# realworld-apps/realworld. Not a test failure: it only means a newer spec exists.
# Fix: git submodule update --remote realworld, then commit the new pin.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Spec is at upstream HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned spec commit with upstream HEAD
        run: |
          pinned="$(git rev-parse HEAD:realworld)"
          latest="$(git ls-remote https://github.com/realworld-apps/realworld.git HEAD | cut -f1)"
          echo "pinned: $pinned"
          echo "latest: $latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::spec is behind upstream HEAD. git submodule update --remote realworld, then commit the new pin."
            exit 1
          fi
